version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hudeem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DSN: "postgres://postgres:postgres@postgres:5432/hudeem?sslmode=disable"
      KUPER_BASE_URL: "http://mock-kuper:8081"
    depends_on:
      postgres:
        condition: service_healthy

  mock-kuper:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8081:8081"

volumes:
  pgdata:
